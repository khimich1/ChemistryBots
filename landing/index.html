      const { useEffect, useRef, useState } = React;

      const SectionTitle = ({ eyebrow, title, subtitle, center = true }) => (

      const Card = ({ className = "", children }) => (
        <div className={`rounded-xl border border-gray-200 bg-white p-6 shadow-card ${className}`}>{children}</div>
      );

      const SectionFrame = ({ children, className = "" }) => (
        <div className={`rounded-2xl border border-sky-200/70 bg-white/80 shadow-card backdrop-blur-sm ${className}`}>{children}</div>
      );

      // Image with graceful fallback: try webp → jpg → inline SVG
      const FALLBACK_IMG =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000' viewBox='0 0 800 1000'>
            <defs>
              <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                <stop offset='0%' stop-color='#E6F3FF'/>
                <stop offset='100%' stop-color='#D2EAFF'/>
              </linearGradient>
            </defs>
            <rect width='800' height='1000' fill='url(#g)'/>
            <g fill='none' stroke='#8CC4FF' stroke-width='6' opacity='0.6'>
              <path d='M140 780l60-200 60 200z'/>
              <circle cx='600' cy='240' r='80'/>
              <rect x='480' y='520' width='180' height='120' rx='18'/>
            </g>
            <text x='50%' y='95%' dominant-baseline='middle' text-anchor='middle' fill='#567' font-family='Inter, Arial' font-size='32'>изображение скоро будет</text>
          </svg>`
        );

      const ImageWithFallback = ({ srcWebp, srcPng, srcJpg, alt, className = "" }) => {
        const [src, setSrc] = React.useState(srcWebp || srcPng || srcJpg || FALLBACK_IMG);
        const [step, setStep] = React.useState(0);
        const handleError = () => {
          if (step === 0 && srcPng && src !== srcPng) {
            setSrc(srcPng);
            setStep(1);
            return;
          }
          if (step <= 1 && srcJpg && src !== srcJpg) {
            setSrc(srcJpg);
            setStep(2);
            return;
          }
          if (src !== FALLBACK_IMG) {
            setSrc(FALLBACK_IMG);
            setStep(3);
          }
        };
        return <img src={src} alt={alt} loading="lazy" onError={handleError} className={className} />;
      };

      // Плавное появление блоков через IntersectionObserver + Tailwind transitions
      const Reveal = ({ children, delay = 0 }) => {
        const ref = useRef(null);
        const [shown, setShown] = useState(false);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const obs = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                const t = setTimeout(() => setShown(true), delay * 1000);
                obs.disconnect();
                return () => clearTimeout(t);
              }
            },
            { threshold: 0.15 }
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, [delay]);

        return (
          <div
            ref={ref}
            className={`transform transition-all duration-700 ease-out ${shown ? "opacity-100 translate-y-0" : "opacity-0 translate-y-4"}`}
          >
            {children}
          </div>
        );
      };

      );

      const FeatureCardImage = ({ image, icon, title, text }) => (

            </header>

            {/* Mobile sticky CTA */}

              <div className="flex items-center gap-2">
                        <a href="https://t.me/controlhim_bot?start=sales" className="flex-1 rounded-full bg-[#00FFFF] px-4 py-2 text-center text-sm font-medium text-gray-900">🚀 Подключиться</a>
                <a href="#pricing" className="rounded-full border border-brand/30 px-4 py-2 text-center text-sm text-brand">Тарифы</a>

            <main>

                      <h1 className="text-4xl font-semibold leading-tight text-gray-900 sm:text-5xl">

                      </h1>
                      <p className="mt-4 max-w-xl text-lg text-gray-600">
                        Умная Telegram‑платформа автоматизирует расписание, оплату, тесты и отчёты. Больше никаких Excel и хаоса.
                      </p>
                      <ul className="mt-5 grid max-w-xl grid-cols-1 gap-2 text-gray-700 sm:grid-cols-2">
                        <li className="flex items-start gap-2"><svg viewBox="0 0 20 20" className="mt-0.5 h-5 w-5 text-brand" fill="currentColor"><path d="M8.7 13.3L5.4 10a1 1 0 10-1.4 1.4l4 4a1 1 0 001.4 0l7-7a1 1 0 10-1.4-1.4l-6.3 6.3z"/></svg><span>Оплаты в один клик</span></li>
                        <li className="flex items-start gap-2"><svg viewBox="0 0 20 20" className="mt-0.5 h-5 w-5 text-brand" fill="currentColor"><path d="M8.7 13.3L5.4 10a1 1 0 10-1.4 1.4l4 4a1 1 0 001.4 0l7-7a1 1 0 10-1.4-1.4l-6.3 6.3z"/></svg><span>Отчёты для родителей</span></li>
